<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Name Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8f3; --card: #ffffff; --ink: #2d2a32; --muted: #7a7380; --line: #ece4dc; --chip: #f4eee8;
    --girl: #e66b8f; --girl-soft: #fde6ec; --boy: #4a8fd4; --boy-soft: #e3effb;
    --either: #8a6fc9; --either-soft: #eee8f8; --gold: #c08a2b;
    --accent: var(--girl); --accent-soft: var(--girl-soft);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a20; --card: #26232b; --ink: #f3eef6; --muted: #a59eab; --line: #3a3540; --chip: #322e38;
      --girl: #f28aa8; --girl-soft: #4a2a35; --boy: #7ab3ec; --boy-soft: #223650;
      --either: #b39ae8; --either-soft: #362c4d; --gold: #e0b35a;
    }
  }
  body[data-g="boy"] { --accent: var(--boy); --accent-soft: var(--boy-soft); }
  body[data-g="either"] { --accent: var(--either); --accent-soft: var(--either-soft); }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Nunito, system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-family: Fraunces, serif; font-size: clamp(2rem, 6vw, 2.8rem); margin: 0; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 4px 0 24px; }
  .sub b { color: var(--accent); }

  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { border: 2px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 18px; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer; }
  .tab.on { border-color: var(--accent); background: var(--accent-soft); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .gender { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .gbtn { border: 2px solid var(--line); background: transparent; color: var(--ink); border-radius: 14px; padding: 12px 4px; font: inherit; font-weight: 700; cursor: pointer; }
  .gbtn[data-v="girl"].on { border-color: var(--girl); background: var(--girl-soft); }
  .gbtn[data-v="boy"].on { border-color: var(--boy); background: var(--boy-soft); }
  .gbtn[data-v="either"].on { border-color: var(--either); background: var(--either-soft); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .section-label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 0 8px; }
  label { font-size: .82rem; font-weight: 700; color: var(--muted); display: block; margin-bottom: 4px; }
  select, input { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .actions { display: flex; gap: 10px; }
  .go { flex: 1; border: 0; border-radius: 14px; padding: 14px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer; }
  .ghost { border: 2px solid var(--line); background: transparent; color: var(--ink); border-radius: 14px; padding: 0 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .go:active, .ghost:active { transform: scale(.98); }
  .count { text-align: center; color: var(--muted); font-size: .9rem; margin: 0 0 14px; min-height: 1.4em; }
  .count b { color: var(--ink); }

  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .results h3 { grid-column: 1 / -1; margin: 10px 0 0; font-family: Fraunces, serif; font-size: 1.2rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; position: relative; animation: pop .35s ease both; }
  .card .name { font-family: Fraunces, serif; font-size: 1.55rem; font-weight: 700; padding-right: 28px; line-height: 1.2; }
  .card .meta { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .card .mean { margin-top: 8px; font-weight: 600; }
  .card .src { font-size: .85rem; color: var(--muted); font-style: italic; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chip { font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); font-weight: 700; }
  .chip.rel { background: var(--accent-soft); color: var(--ink); }
  .chip.kind { background: transparent; border: 1px solid var(--line); }
  .heart { position: absolute; top: 10px; right: 10px; border: 0; background: none; font-size: 1.3rem; cursor: pointer; color: var(--muted); }
  .heart.on { color: var(--girl); }
  .empty { color: var(--muted); text-align: center; padding: 24px; grid-column: 1 / -1; }
  .hint { font-size: .88rem; color: var(--muted); margin: 0 0 12px; }
  .hidden { display: none !important; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body data-g="girl">
<main>
  <h1>Baby Name Maker</h1>
  <p class="sub">Over <b id="total">200,000</b> names for your little one 👶</p>

  <div class="tabs">
    <button class="tab on" data-tab="find">Find names</button>
    <button class="tab" data-tab="blend">Mom + Dad</button>
    <button class="tab" data-tab="favs">Favorites <span id="favCount"></span></button>
  </div>

  <div class="panel" id="panel">
    <div class="gender">
      <button class="gbtn on" data-v="girl">👧 Girl</button>
      <button class="gbtn" data-v="boy">👦 Boy</button>
      <button class="gbtn" data-v="either">🌈 Either</button>
    </div>

    <div id="blendInputs" class="hidden">
      <p class="hint">Type both parents' names. You'll get blends of the two, plus real names that use both your initials.</p>
      <div class="grid" style="grid-template-columns: 1fr 1fr">
        <div><label for="mom">Mom's name</label><input id="mom" placeholder="e.g. Priya"></div>
        <div><label for="dad">Dad's name</label><input id="dad" placeholder="e.g. Daniel"></div>
      </div>
    </div>

    <div class="section-label">Meaning &amp; background</div>
    <div class="grid">
      <div><label for="theme">Meaning</label><select id="theme"></select></div>
      <div><label for="religion">Religion</label><select id="religion"></select></div>
      <div><label for="culture">Culture / ethnicity</label><select id="culture"></select></div>
      <div><label for="lang">Language</label><select id="lang"></select></div>
    </div>

    <div id="letterFilters">
      <div class="section-label">Letters</div>
      <div class="grid">
        <div><label for="first">Starts with letter</label><select id="first"></select></div>
        <div><label for="first2">First 2 letters</label><input id="first2" maxlength="2" placeholder="e.g. Ar"></div>
        <div><label for="ends">Ends with</label><input id="ends" maxlength="5" placeholder="e.g. a, el, ya"></div>
        <div><label for="kind">Name type</label>
          <select id="kind">
            <option value="">All names</option>
            <option value="real">Real names (with stories)</option>
            <option value="root">Built from real roots</option>
            <option value="invented">Invented originals</option>
          </select></div>
      </div>
    </div>

    <div class="actions">
      <button class="go" id="go">✨ Make names</button>
      <button class="ghost" id="reset" title="Clear filters">Reset</button>
    </div>
  </div>

  <p class="count" id="count"></p>
  <div class="results" id="results"></div>
  <div class="actions" style="margin-top:16px"><button class="ghost hidden" id="more" style="flex:1;padding:12px">Show more names ↓</button></div>
</main>

<script src="names.js"></script>
<script src="generator.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const BATCH = 12;

// ── data ──
const ROOT_NAMES = buildRootNames();
const TAKEN = new Set([...REAL, ...ROOT_NAMES].map(x => x.n.toLowerCase()));
const INVENTED = {}; // built lazily per gender
const invented = g => INVENTED[g] || (INVENTED[g] = buildInvented(g, TAKEN));
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[\s-]/g, "");
const KIND_LABEL = { real: "Real name", root: "Built from roots", invented: "✨ Invented" };

let gender = "girl", tab = "find", pools = null, shown = [], seen = new Set();

// ── favorites (per browser) ──
const favKey = x => `${x.n}|${x.o}`;
function loadFavs() { try { return JSON.parse(localStorage.getItem("bnm-favs-v2")) || []; } catch { return []; } }
function saveFavs() { try { localStorage.setItem("bnm-favs-v2", JSON.stringify(favs)); } catch {} }
let favs = loadFavs();

// ── filter dropdowns ──
const uniq = arr => [...new Set(arr)].filter(Boolean).sort((a, b) => a.localeCompare(b));
const ALL_NAMED = [...REAL, ...ROOT_NAMES];
function fillSelect(el, anyLabel, values) {
  const cur = el.value;
  el.innerHTML = `<option value="">${anyLabel}</option>` + values.map(v => `<option>${v}</option>`).join("");
  if (values.includes(cur)) el.value = cur;
}
fillSelect($("#religion"), "Any religion", uniq(ALL_NAMED.flatMap(x => x.r)));
fillSelect($("#culture"), "Any culture", uniq(ALL_NAMED.map(x => x.o)));
fillSelect($("#lang"), "Any language", uniq(ALL_NAMED.map(x => x.l)));
fillSelect($("#first"), "Any letter", "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""));
const fillThemes = () => fillSelect($("#theme"), "Any meaning", THEME_ORDER[gender]);
fillThemes();

function filters() {
  return { theme: $("#theme").value, religion: $("#religion").value, culture: $("#culture").value, lang: $("#lang").value,
    first: $("#first").value.toLowerCase(), first2: fold($("#first2").value), ends: fold($("#ends").value), kind: $("#kind").value };
}
const genderOk = x => gender === "either" ? x.g === "either" : x.g === gender || x.g === "either";

function matches(x, f, letters = true) {
  if (!genderOk(x)) return false;
  if (f.theme && !themesOf(x).includes(f.theme)) return false;
  if (f.religion && !x.r.includes(f.religion)) return false;
  if (f.culture && x.o !== f.culture) return false;
  if (f.lang && x.l !== f.lang) return false;
  if (letters) {
    const n = fold(x.n);
    if (f.first && !n.startsWith(f.first)) return false;
    if (f.first2 && !n.startsWith(f.first2)) return false;
    if (f.ends && !n.endsWith(f.ends)) return false;
  }
  return true;
}

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

function buildPools() {
  const f = filters();
  const needsMeaning = f.theme || f.religion || f.culture || f.lang; // invented names have no meaning/background
  const want = k => !f.kind || f.kind === k;
  pools = {
    real: want("real") ? shuffle(REAL.filter(x => matches(x, f))) : [],
    root: want("root") ? shuffle(ROOT_NAMES.filter(x => matches(x, f))) : [],
    invented: want("invented") && !needsMeaning ? shuffle(invented(gender).filter(x => matches(x, f))) : [],
  };
  pools.ptr = { real: 0, root: 0, invented: 0 };
  const total = pools.real.length + pools.root.length + pools.invented.length;
  const fmt = n => n.toLocaleString();
  $("#count").innerHTML = total
    ? `<b>${fmt(total)}</b> matching names · ${fmt(pools.real.length)} real · ${fmt(pools.root.length)} from roots · ${fmt(pools.invented.length)} invented`
    : "";
  if (needsMeaning && f.kind === "invented") $("#count").textContent = "Invented names don't have meanings or a religion/culture yet. Clear those filters to see them.";
}

// Mix real names, root names and invented names; real ones show up most.
function draw(n) {
  const out = [], W = { real: 5, root: 3, invented: 3 };
  while (out.length < n) {
    const open = Object.keys(W).filter(k => pools.ptr[k] < pools[k].length);
    if (!open.length) break;
    let r = Math.random() * open.reduce((s, k) => s + W[k], 0), k = open[0];
    for (const key of open) { r -= W[key]; if (r <= 0) { k = key; break; } }
    const x = pools[k][pools.ptr[k]++];
    if (!seen.has(x.n)) { seen.add(x.n); out.push(x); }
  }
  return out;
}
const left = () => pools && ["real", "root", "invented"].some(k => pools.ptr[k] < pools[k].length);

// ── rendering ──
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function card(x, i) {
  const on = favs.some(f => favKey(f) === favKey(x));
  const where = [x.o, x.l && x.l !== x.o ? x.l : ""].filter(Boolean).join(" · ") || "Original";
  const themes = themesOf(x).slice(0, 3);
  return `<div class="card" style="animation-delay:${(i % BATCH) * 35}ms">
    <button class="heart ${on ? "on" : ""}" data-i="${i}" aria-label="Save ${esc(x.n)}">${on ? "♥" : "♡"}</button>
    <div class="name">${esc(x.n)}</div>
    <div class="meta"><span class="dot" style="background:var(--${x.g})"></span>${esc(where)}</div>
    ${x.m ? `<div class="mean">“${esc(x.m)}”</div>` : ""}
    ${x.src ? `<div class="src">${esc(x.src)}</div>` : ""}
    <div class="chips">
      ${x.r.map(r => `<span class="chip rel">${esc(r)}</span>`).join("")}
      ${themes.map(t => `<span class="chip">${esc(t)}</span>`).join("")}
      <span class="chip kind">${KIND_LABEL[x.type]}</span>
    </div></div>`;
}
// items: array of names, or of {heading} markers
function render(items, emptyMsg) {
  shown = items;
  $("#favCount").textContent = favs.length ? `(${favs.length})` : "";
  if (!items.some(x => !x.heading)) { $("#results").innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }
  $("#results").innerHTML = items.map((x, i) => x.heading ? `<h3>${esc(x.heading)}</h3>` : card(x, i)).join("");
}

function find() {
  seen = new Set(); buildPools();
  render(draw(BATCH), "No names match all those filters. Try loosening one!");
  $("#more").classList.toggle("hidden", !left());
}
function more() {
  render([...shown, ...draw(BATCH)]);
  $("#more").classList.toggle("hidden", !left());
}

// ── Mom + Dad ──
function blendNames(a, b) {
  const vowels = /[aeiouy]/i, out = new Set(), A = a.toLowerCase(), B = b.toLowerCase();
  const cuts = w => { const c = []; for (let i = 2; i < w.length - 1; i++) if (vowels.test(w[i - 1]) || vowels.test(w[i])) c.push(i); return c.length ? c : [Math.ceil(w.length / 2)]; };
  for (const [x, y] of [[a, b], [b, a]])
    for (const i of cuts(x)) for (const j of cuts(y)) {
      if (x[i - 1].toLowerCase() === y[j].toLowerCase()) continue;
      const n = x.slice(0, i) + y.slice(j);
      const low = n.toLowerCase();
      if (low !== A && low !== B && sayable(n)) out.add(n.charAt(0).toUpperCase() + low.slice(1));
    }
  return [...out];
}
function blend() {
  const a = $("#mom").value.trim(), b = $("#dad").value.trim();
  $("#more").classList.add("hidden");
  if (!a || !b) { $("#count").textContent = ""; return render([], "Type Mom's and Dad's names, then tap Make names 💞"); }
  const f = filters();
  const blends = shuffle(blendNames(a, b)).slice(0, 8)
    .map(n => ({ n, g: gender, o: "", l: "", r: [], m: `a blend of ${a} + ${b}`, src: "", type: "invented" }));
  // real & root names that carry both parents' initials
  const ia = fold(a)[0], ib = fold(b)[0];
  const named = [...REAL, ...ROOT_NAMES].filter(x => matches(x, f, false));
  const both = named.filter(x => { const n = fold(x.n); return (n[0] === ia && n.slice(1).includes(ib)) || (n[0] === ib && n.slice(1).includes(ia)); });
  const either = named.filter(x => [ia, ib].includes(fold(x.n)[0]) && !both.includes(x));
  const initials = [...shuffle(both.filter(x => x.type === "real")), ...shuffle(both.filter(x => x.type !== "real")), ...shuffle(either)].slice(0, 8);
  $("#count").innerHTML = `<b>${blends.length}</b> blends · <b>${both.length + either.length}</b> names with Mom's or Dad's initial`;
  render([
    { heading: `💞 ${a} + ${b} blends` }, ...blends,
    { heading: `🔤 Names with ${ia.toUpperCase()} & ${ib.toUpperCase()}` }, ...initials,
  ], "Couldn't blend those. Try different spellings!");
}

function showFavs() { $("#count").textContent = ""; $("#more").classList.add("hidden"); render(favs, "No favorites yet. Tap ♡ on a name to save it."); }
const run = () => tab === "find" ? find() : tab === "blend" ? blend() : showFavs();

// ── events ──
$$(".gbtn").forEach(btn => btn.onclick = () => {
  gender = btn.dataset.v; document.body.dataset.g = gender;
  $$(".gbtn").forEach(b => b.classList.toggle("on", b === btn));
  fillThemes(); run();
});
$$(".tab").forEach(btn => btn.onclick = () => {
  tab = btn.dataset.tab;
  $$(".tab").forEach(b => b.classList.toggle("on", b === btn));
  $("#panel").classList.toggle("hidden", tab === "favs");
  $("#blendInputs").classList.toggle("hidden", tab !== "blend");
  $("#letterFilters").classList.toggle("hidden", tab === "blend");
  run();
});
$("#results").onclick = e => {
  const h = e.target.closest(".heart"); if (!h) return;
  const x = shown[h.dataset.i];
  favs = favs.some(f => favKey(f) === favKey(x)) ? favs.filter(f => favKey(f) !== favKey(x)) : [...favs, x];
  saveFavs();
  if (tab === "favs") return showFavs();
  h.classList.toggle("on"); h.textContent = h.classList.contains("on") ? "♥" : "♡";
  $("#favCount").textContent = favs.length ? `(${favs.length})` : "";
};
// keep "starts with letter" and "first 2 letters" in sync
$("#first2").oninput = () => { const c = $("#first2").value.trim()[0]; if (c) $("#first").value = c.toUpperCase(); };
$("#first").onchange = () => { const v = $("#first2").value.trim(); if (v && v[0].toUpperCase() !== $("#first").value) $("#first2").value = ""; find(); };
["#theme", "#religion", "#culture", "#lang", "#kind"].forEach(s => $(s).onchange = run);
["#first2", "#ends", "#mom", "#dad"].forEach(s => $(s).onkeydown = e => e.key === "Enter" && run());
$("#go").onclick = run;
$("#more").onclick = more;
$("#reset").onclick = () => {
  ["#theme", "#religion", "#culture", "#lang", "#first", "#first2", "#ends", "#kind"].forEach(s => $(s).value = "");
  run();
};

$("#total").textContent = (REAL.length + ROOT_NAMES.length + ["girl", "boy", "either"].reduce((s, g) => s + invented(g).length, 0)).toLocaleString();
find();
</script>
</body>
</html>
